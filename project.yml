name: MagicLock
options:
  bundleIdPrefix: com.victorlamh
  deploymentTarget:
    iOS: "17.0"

targets:
  MagicLock:
    type: application
    platform: iOS
    sources:
      - MagicLock
    info:
      path: MagicLock/Info.plist
    properties:
      CFBundleDisplayName: MagicLock
      CFBundleName: MagicLock
      UILaunchScreen: {}
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorlamh.magiclock
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
